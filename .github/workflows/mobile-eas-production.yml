name: Mobile EAS Production

# Production mobile releases are reconciled by the unified release workflow.
# The committed source has no release version: CI injects either the version of
# the latest compatible build (OTA) or the unified release version (new build).
on:
  workflow_call:
    inputs:
      release_version:
        description: "Unified release version used only when a native build is required"
        required: true
        type: string
      release_ref:
        description: "Commit to build or publish"
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      mode:
        description: "build (artifact only, no store submission) or update (OTA)"
        required: true
        type: choice
        default: build
        options:
          - build
          - update
      platform:
        description: "Target platform"
        required: true
        type: choice
        default: android
        options:
          - android
          - ios
          - all
      version:
        description: "Existing mobile version for OTA, or new version for a build"
        required: true
        type: string
      message:
        description: "OTA update message (mode=update only)"
        required: false
        type: string

concurrency:
  group: mobile-eas-production
  cancel-in-progress: false

jobs:
  production:
    name: EAS Production ${{ github.event_name == 'workflow_call' && 'release' || inputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EAS_OWNER: ${{ vars.EAS_OWNER }}
    steps:
      - id: expo-token
        name: Check release configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          for name in EXPO_TOKEN EAS_PROJECT_ID EAS_OWNER; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Mobile EAS release is not configured; missing:${missing}" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.release_ref || github.sha }}
          fetch-depth: 0
          # EAS archives the project through a local git clone. Partial clones
          # cannot serve blobs that were omitted by sparse checkout.

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Pull production environment variables
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull production --non-interactive

      - id: release-decision
        name: Compare fingerprint with latest production build
        if: github.event_name == 'workflow_call'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          latest_json="$(eas build:list \
            --platform android \
            --build-profile production \
            --status finished \
            --limit 1 \
            --json \
            --non-interactive)"
          latest_id="$(jq -r '.[0].id // empty' <<<"$latest_json")"
          latest_version="$(jq -r '.[0].appVersion // empty' <<<"$latest_json")"

          if [ -z "$latest_id" ] || [ -z "$latest_version" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "mobile_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "No finished production Android build exists; building $RELEASE_VERSION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          export MOBILE_VERSION="$latest_version"
          fingerprint_json="$(eas fingerprint:generate \
            --platform android \
            --environment production \
            --json \
            --non-interactive)"
          fingerprint_hash="$(jq -r '.hash' <<<"$fingerprint_json")"
          matching_json="$(eas build:list \
            --platform android \
            --build-profile production \
            --status finished \
            --fingerprint-hash "$fingerprint_hash" \
            --limit 1 \
            --json \
            --non-interactive)"
          matching_id="$(jq -r '.[0].id // empty' <<<"$matching_json")"

          echo "fingerprint=$fingerprint_hash" >> "$GITHUB_OUTPUT"
          if [ "$matching_id" = "$latest_id" ]; then
            echo "mode=update" >> "$GITHUB_OUTPUT"
            echo "mobile_version=$latest_version" >> "$GITHUB_OUTPUT"
            echo "Android fingerprint matches latest build $latest_id; publishing OTA for mobile $latest_version." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "mobile_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "Android fingerprint differs from latest build $latest_id; building unified release $RELEASE_VERSION." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync release mobile version to EAS
        if: github.event_name == 'workflow_call'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_VERSION: ${{ steps.release-decision.outputs.mobile_version }}
        run: |
          eas env:set production \
            --name MOBILE_VERSION \
            --value "$MOBILE_VERSION" \
            --visibility plaintext \
            --scope project \
            --non-interactive

      - name: Publish release OTA
        if: github.event_name == 'workflow_call' && steps.release-decision.outputs.mode == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_VERSION: ${{ steps.release-decision.outputs.mobile_version }}
        run: |
          eas update \
            --channel production \
            --environment production \
            --platform android \
            --message "S5 Code ${{ inputs.release_version }} (mobile $MOBILE_VERSION)" \
            --non-interactive

      - name: Build release Android APK
        if: github.event_name == 'workflow_call' && steps.release-decision.outputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_VERSION: ${{ steps.release-decision.outputs.mobile_version }}
        run: |
          set -euo pipefail
          build_json="$(eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --wait \
            --json)"
          build_url="$(jq -r 'if type == "array" then .[0].artifacts.buildUrl else .artifacts.buildUrl end // empty' <<<"$build_json")"
          if [ -z "$build_url" ]; then
            echo "EAS build completed without an Android artifact URL." >&2
            exit 1
          fi

          mkdir -p release-publish
          curl --fail --location --retry 3 \
            "$build_url" \
            --output "release-publish/s5code-${{ inputs.release_version }}.apk"

      - name: Upload release APK
        if: github.event_name == 'workflow_call' && steps.release-decision.outputs.mode == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apps/mobile/release-publish/s5code-${{ inputs.release_version }}.apk
          if-no-files-found: error

      - name: Sync manual mobile version to EAS
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_VERSION: ${{ inputs.version }}
        run: |
          eas env:set production \
            --name MOBILE_VERSION \
            --value "$MOBILE_VERSION" \
            --visibility plaintext \
            --scope project \
            --non-interactive

      - name: Build manually
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_VERSION: ${{ inputs.version }}
        run: eas build --platform ${{ inputs.platform }} --profile production --non-interactive --no-wait

      - name: Publish OTA manually
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_VERSION: ${{ inputs.version }}
        run: |
          eas update \
            --channel production \
            --environment production \
            --platform ${{ inputs.platform }} \
            --message "${{ inputs.message || format('Production OTA ({0})', github.sha) }}" \
            --non-interactive
