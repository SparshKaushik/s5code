name: Mobile EAS Production

# Production mobile releases are reconciled by the unified release workflow.
# The committed source has no release version: CI injects either the version of
# the latest compatible build (OTA) or the unified release version (new build).
#
# Android builds run locally on this runner via `eas build --local` instead of
# EAS's cloud build queue (avoids queue wait times), while still using the
# signing keystore EAS manages remotely for the "production" profile
# (credentialsSource defaults to "remote" in eas.json, downloaded here over
# EXPO_TOKEN auth). `eas build --local` builds are not recorded in EAS's build
# history, so build-vs-OTA fingerprint comparison uses this repo's own GitHub
# Release history (a `fingerprint.txt` asset on the previous release) instead
# of `eas build:list`.
on:
  workflow_call:
    inputs:
      release_version:
        description: "Unified release version used only when a native build is required"
        required: true
        type: string
      release_ref:
        description: "Commit to build or publish"
        required: true
        type: string
    secrets:
      EXPO_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      mode:
        description: "build (artifact only, no store submission) or update (OTA)"
        required: true
        type: choice
        default: build
        options:
          - build
          - update
      version:
        description: "Existing mobile version for OTA, or new version for a build"
        required: true
        type: string
      message:
        description: "OTA update message (mode=update only)"
        required: false
        type: string

concurrency:
  group: mobile-eas-production
  cancel-in-progress: false

jobs:
  production:
    # github.event_name inside a called reusable workflow reflects the
    # *caller's* triggering event (push/workflow_dispatch on release.yml),
    # never 'workflow_call' itself. Every step below branches on whether
    # release_version was supplied (only present via the workflow_call
    # inputs) instead.
    name: EAS Production ${{ inputs.release_version != '' && 'release' || inputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      APP_VARIANT: production
      NODE_OPTIONS: --max-old-space-size=8192
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EAS_OWNER: ${{ vars.EAS_OWNER }}
    steps:
      - id: expo-token
        name: Check release configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          missing=""
          for name in EXPO_TOKEN EAS_PROJECT_ID EAS_OWNER; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Mobile EAS release is not configured; missing:${missing}" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_version != '' && inputs.release_ref || github.sha }}
          fetch-depth: 0
          # EAS archives the project through a local git clone. Partial clones
          # cannot serve blobs that were omitted by sparse checkout.

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Pull production environment variables
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull production --non-interactive

      - id: release-decision
        name: Compare fingerprint with latest release
        if: inputs.release_version != ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fingerprint_json="$(eas fingerprint:generate \
            --platform android \
            --environment production \
            --json \
            --non-interactive)"
          fingerprint_hash="$(jq -r '.hash' <<<"$fingerprint_json")"
          echo "fingerprint=$fingerprint_hash" >> "$GITHUB_OUTPUT"

          # The previous release's fingerprint.txt (if any) is this repo's own
          # record of what native build shipped, since eas build --local never
          # registers in `eas build:list`. No previous release, or no asset on
          # it (pre-migration release, or last release was OTA-only and thus
          # kept the older asset), means there is nothing to match against.
          previous_tag="$(gh release list \
            --repo "${{ github.repository }}" \
            --exclude-drafts \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[0].tagName // empty')"

          if [ -z "$previous_tag" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "mobile_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "No previous release exists; building $RELEASE_VERSION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          previous_fingerprint="$(gh release download "$previous_tag" \
            --repo "${{ github.repository }}" \
            --pattern 'fingerprint.txt' \
            --output - 2>/dev/null || true)"
          previous_version="${previous_tag#v}"

          if [ -z "$previous_fingerprint" ]; then
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "mobile_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "Previous release $previous_tag has no recorded fingerprint; building $RELEASE_VERSION." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$previous_fingerprint" = "$fingerprint_hash" ]; then
            echo "mode=update" >> "$GITHUB_OUTPUT"
            echo "mobile_version=$previous_version" >> "$GITHUB_OUTPUT"
            echo "Android fingerprint matches $previous_tag; publishing OTA for mobile $previous_version." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=build" >> "$GITHUB_OUTPUT"
            echo "mobile_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "Android fingerprint differs from $previous_tag; building unified release $RELEASE_VERSION." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync release mobile version to EAS
        if: inputs.release_version != ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_VERSION: ${{ steps.release-decision.outputs.mobile_version }}
        run: |
          eas env:set production \
            --name MOBILE_VERSION \
            --value "$MOBILE_VERSION" \
            --visibility plaintext \
            --scope project \
            --non-interactive

      - name: Publish release OTA
        if: inputs.release_version != '' && steps.release-decision.outputs.mode == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_VERSION: ${{ steps.release-decision.outputs.mobile_version }}
        run: |
          eas update \
            --channel production \
            --environment production \
            --platform android \
            --message "S5 Code ${{ inputs.release_version }} (mobile $MOBILE_VERSION)" \
            --non-interactive

      - name: Build release Android APK locally
        if: inputs.release_version != '' && steps.release-decision.outputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_VERSION: ${{ steps.release-decision.outputs.mobile_version }}
        run: |
          set -euo pipefail
          mkdir -p release-publish
          eas build \
            --local \
            --platform android \
            --profile production \
            --non-interactive \
            --output "release-publish/s5code-${{ inputs.release_version }}.apk"
          echo "${{ steps.release-decision.outputs.fingerprint }}" > release-publish/fingerprint.txt

      - name: Upload release APK
        if: inputs.release_version != '' && steps.release-decision.outputs.mode == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            apps/mobile/release-publish/s5code-${{ inputs.release_version }}.apk
            apps/mobile/release-publish/fingerprint.txt
          if-no-files-found: error

      - name: Sync manual mobile version to EAS
        if: inputs.release_version == ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_VERSION: ${{ inputs.version }}
        run: |
          eas env:set production \
            --name MOBILE_VERSION \
            --value "$MOBILE_VERSION" \
            --visibility plaintext \
            --scope project \
            --non-interactive

      - name: Build manually
        if: inputs.release_version == '' && inputs.mode == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-publish
          eas build \
            --local \
            --platform android \
            --profile production \
            --non-interactive \
            --output "release-publish/s5code-${{ inputs.version }}.apk"

      - name: Upload manual build APK
        if: inputs.release_version == '' && inputs.mode == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-manual
          path: apps/mobile/release-publish/s5code-${{ inputs.version }}.apk
          if-no-files-found: error

      - name: Publish OTA manually
        if: inputs.release_version == '' && inputs.mode == 'update'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MOBILE_VERSION: ${{ inputs.version }}
        run: |
          eas update \
            --channel production \
            --environment production \
            --platform android \
            --message "${{ inputs.message || format('Production OTA ({0})', github.sha) }}" \
            --non-interactive
