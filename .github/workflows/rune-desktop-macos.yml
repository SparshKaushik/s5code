name: Rune desktop prototype (macOS)

on:
  push:
    branches: [feat/rune-desktop-prototype]
    paths:
      - apps/desktop-rune/**
      - scripts/build-server-binary.ts
      - .github/workflows/rune-desktop-macos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rune-desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop-rune
    # The Open source licenses page embeds this manifest (build.rs); set for every cargo step so
    # tests don't rebuild without it.
    env:
      S5_CRATE_NOTICES: target/crate-notices.json
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop-rune/target
          key: rune-macos-${{ runner.arch }}-${{ hashFiles('apps/desktop-rune/Cargo.lock') }}
          restore-keys: rune-macos-${{ runner.arch }}-

      - name: Rust crate notices
        run: |
          cargo fetch --locked
          mkdir -p target
          python3 tools/crate_notices.py target/crate-notices.json

      - name: Build
        run: cargo build --release --locked

      # The app starts this bundled server on launch, as the Electron app starts its own.
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/scripts...

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Same pin as s5-release.yml: the compiled binary embeds this Bun runtime.
          bun-version: "1.4.4"

      - name: Build server binary
        working-directory: .
        run: node scripts/build-server-binary.ts --platform darwin --arch arm64 --output-dir "$RUNNER_TEMP/server" --verbose

      - name: Bundle S5 Code (Rune).app
        run: |
          app="dist/S5 Code (Rune).app"
          mkdir -p "$app/Contents/MacOS"
          cp target/release/s5code-rune "$app/Contents/MacOS/s5code-rune"
          install -m 755 "$RUNNER_TEMP"/server/s5code-server-*-darwin-arm64 "$app/Contents/MacOS/s5code-server"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>S5 Code (Rune)</string>
            <key>CFBundleDisplayName</key><string>S5 Code (Rune)</string>
            <key>CFBundleIdentifier</key><string>in.newsa.s5code.rune-prototype</string>
            <key>CFBundleExecutable</key><string>s5code-rune</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.0.1</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleURLTypes</key>
            <array>
              <dict>
                <key>CFBundleURLName</key><string>S5 Code prompt link</string>
                <key>CFBundleURLSchemes</key><array><string>s5code</string><string>t3code</string></array>
              </dict>
              <dict>
                <key>CFBundleURLName</key><string>Web link</string>
                <key>CFBundleTypeRole</key><string>Viewer</string>
                <key>CFBundleURLSchemes</key><array><string>http</string><string>https</string></array>
              </dict>
            </array>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key><string>Web page</string>
                <key>CFBundleTypeRole</key><string>Viewer</string>
                <key>LSHandlerRank</key><string>Alternate</string>
                <key>LSItemContentTypes</key><array><string>public.html</string><string>public.xhtml</string></array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --sign - "$app/Contents/MacOS/s5code-server"
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"
          # Start the bundled server, sign in and load the shell, against a throwaway T3 home.
          T3CODE_HOME="$RUNNER_TEMP/t3home" "$app/Contents/MacOS/s5code-rune" --check-server || {
            tail -80 "$RUNNER_TEMP/t3home/userdata/logs/desktop-rune-server.log"; exit 1; }
          ditto -c -k --keepParent "$app" "dist/S5-Code-Rune-macos-arm64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: S5-Code-Rune-macos-arm64
          path: apps/desktop-rune/dist/S5-Code-Rune-macos-arm64.zip
          if-no-files-found: error
