name: Rune lock (temporary)

# Temporary: resolves Cargo.lock for a new dependency without a local cargo. Removed once its
# artifacts are committed.

on:
  push:
    branches: ["feat/rune-p3-settings"]
    paths: [".github/workflows/rune-lock-tmp.yml"]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop-rune
    steps:
      - uses: actions/checkout@v6
      - name: Tools
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Lock zip
        run: |
          mkdir -p out
          cargo info zip | tee out/zip-info.txt
          cargo add zip --no-default-features --features deflate-flate2
          cargo fetch
          cargo tree -e features -i zip | tee out/zip-tree.txt
          cp Cargo.toml Cargo.lock out/
      - uses: actions/upload-artifact@v4
        with:
          name: rune-lock
          path: apps/desktop-rune/out
