name: Rune lock (temporary)

# Temporary: resolves Cargo.lock for a new dependency without a local cargo, and makes the
# H.264 test clip with ffmpeg. Removed once its artifacts are committed.

on:
  push:
    branches: ["feat/rune-p3-desktop"]
    paths: [".github/workflows/rune-lock-tmp.yml"]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop-rune
    steps:
      - uses: actions/checkout@v6
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          rustup toolchain install stable --profile minimal && rustup default stable
      - name: Lock openh264
        run: |
          cargo add openh264 --target 'cfg(target_os = "linux")'
          cargo fetch
          mkdir -p out && cp Cargo.toml Cargo.lock out/
          grep -A3 'name = "openh264' Cargo.lock
          v=$(grep -A1 '^name = "openh264"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cp -r ~/.cargo/registry/src/*/openh264-$v out/openh264-src
      - name: Test clip
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i "color=c=red:s=64x24:r=30:d=1" -f lavfi -i "color=c=blue:s=64x24:r=30:d=1" \
            -filter_complex "[0][1]vstack" -frames:v 3 -c:v libx264 -profile:v baseline -bf 0 -pix_fmt yuv420p \
            -x264-params keyint=30 -f h264 out/split-64x48.h264
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: rune-lock
          path: apps/desktop-rune/out
