name: Deploy Web Frontend

# Builds the hosted web app (apps/web) against the self-hosted T3 Connect relay
# and Clerk instance, then uploads the static bundle to Cloudflare Pages.
#
# This is the fork's equivalent of the upstream hosted app: it serves /pair and
# the /connect + /connect/callback CLI OAuth routes, so headless/SSH servers can
# complete `t3 connect link` out-of-band without a local browser.
#
# One-time setup (see docs):
#   1. Create the Pages project:
#        npx wrangler pages project create <name> --production-branch main
#   2. Set repo variable CLOUDFLARE_PAGES_PROJECT = <name>.
#   3. (Optional) Set repo variable WEB_HOSTED_APP_URL if you use a custom
#      domain instead of the default https://<name>.pages.dev.
#   4. In the Clerk Dashboard, add the redirect URI
#      https://<pages-url>/connect/callback to the headless CLI OAuth app.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Public build-time identifiers (same values as release.yml).
      T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuczVjb2RlLnRvdWNodGVjaC5jbHViJA
      T3CODE_CLERK_JWT_TEMPLATE: s5-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: Uh0fH8x0GWSj2HIL
      T3CODE_RELAY_URL: https://relay.s5code.dpdns.org
      # The production origin the bundle self-identifies as (for /connect). Not
      # the canonical T3CODE_HOSTED_APP_URL: the web bundle reads VITE_HOSTED_APP_URL.
      VITE_HOSTED_APP_URL: ${{ vars.WEB_HOSTED_APP_URL || format('https://{0}.pages.dev', vars.CLOUDFLARE_PAGES_PROJECT) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/web...
              - --filter=@t3tools/scripts...

      - name: Build web app
        run: vp run --filter @t3tools/web build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy apps/web/dist \
            --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}"
