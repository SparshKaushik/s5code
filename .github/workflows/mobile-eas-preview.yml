name: Mobile EAS Preview

# Publishes a JS-only OTA update for the PR's Android dev-client build.
# `eas build --local` (see mobile-eas-production.yml for why) means EAS's
# cloud build history no longer reflects what dev-client binaries reviewers
# already have installed, so per-PR native builds are not attempted here.
# When the native fingerprint changes on a PR, this only publishes the OTA
# for the runtime version that fingerprint would map to; a reviewer without
# a dev-client build matching that fingerprint needs one built and installed
# out of band (`pnpm eas:android:preview:dev` locally) before the OTA is
# visible in their app.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

jobs:
  preview:
    name: EAS Preview
    if: |
      contains(github.event.pull_request.labels.*.name, '🚀 Mobile Continuous Deployment') &&
      (github.event.action != 'labeled' || github.event.label.name == '🚀 Mobile Continuous Deployment')
    runs-on: ubuntu-24.04
    concurrency:
      group: mobile-eas-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    env:
      APP_VARIANT: preview
      NODE_OPTIONS: --max-old-space-size=8192
      MOBILE_VERSION_POLICY: fingerprint
    steps:
      - id: expo-token
        name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not available; skipping EAS preview."
          fi

      - name: Checkout
        if: steps.expo-token.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # No sparse-checkout here: it makes actions/checkout fetch with
          # --filter=blob:none, and eas-cli archives the project via
          # `git clone --depth 1 file://<workspace>`, which fails (exit 128)
          # when the partial clone can't serve the unfetched blobs.

      - name: Setup Vite+
        if: steps.expo-token.outputs.present == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        if: steps.expo-token.outputs.present == 'true'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        if: steps.expo-token.outputs.present == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # npm, not pnpm: this only installs eas-cli into the action's own
          # tool dir, and pnpm 11 hard-fails that install on dtrace-provider's
          # ignored build script (no allowBuilds config outside the repo).
          packager: npm

      - name: Pull preview environment variables
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull preview --non-interactive

      - id: fingerprint
        name: Compute Android fingerprint
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          # --build-profile, not --environment: eas-cli has a known bug
          # (expo/eas-cli#3870) where --environment logs a stray
          # "Using environment: ..." line to real stdout before the JSON
          # redirect is installed, corrupting --json output for jq. The
          # "preview" build profile in eas.json maps to the same EAS
          # environment, so this is equivalent here.
          fingerprint_json="$(eas fingerprint:generate \
            --platform android \
            --build-profile preview \
            --json \
            --non-interactive)"
          echo "hash=$(jq -r '.hash' <<<"$fingerprint_json")" >> "$GITHUB_OUTPUT"

      - name: Publish preview OTA
        if: steps.expo-token.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --channel preview \
            --environment preview \
            --platform android \
            --branch pr-${{ github.event.pull_request.number }} \
            --message "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" \
            --non-interactive

      - name: Comment on PR
        if: steps.expo-token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo "${{ github.repository }}" \
            --edit-last --create-if-none \
            --body "$(cat <<EOF
          ### 🚀 Mobile Preview

          Published a JS-only OTA update to branch \`pr-${{ github.event.pull_request.number }}\` (Android fingerprint \`${{ steps.fingerprint.outputs.hash }}\`).

          This updates JS/assets on an existing dev-client build with a matching native fingerprint. If the fingerprint changed with this push (native deps, config plugins, or app.config.ts), rebuild the dev client before this update is visible:

          \`\`\`
          pnpm --filter @t3tools/mobile eas:android:preview:dev
          \`\`\`
          EOF
          )"
