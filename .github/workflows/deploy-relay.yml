name: Deploy T3 Connect relay

# Self-hosted relay deployment for the S5 Code fork (Neon-backed).
# Mirrors upstream `pingdotgg/t3code`{.github/workflows/deploy-relay.yml} but
# replaces hosted PlanetScale with a Neon `DATABASE_URL`. Apple/APNs and
# Firebase/FCM push credentials are both optional (see infra/relay/README.md);
# when absent for a given provider, that provider's mobile notifications are
# disabled but the relay still deploys. Vars and secrets are read from the
# `production` GitHub Environment; Cloudflare and Axiom account credentials
# may live there or at the repository level (Actions falls back to repo-level
# for `vars.*` / `secrets.*`).
#
#   DB migrations are NOT run here: the schema must be applied to Neon
#   out-of-band with `drizzle-kit migrate` against the same DATABASE_URL (see
#   infra/relay/README.md). The relay Worker reads schema written by migration.

on:
  push:
    branches:
      - main
  # Alchemy does not redeploy the Worker when only a Config value read in its
  # Init changes (alchemy-run/alchemy#1831), so a changed repository variable
  # needs a forced deploy to reach production.
  workflow_dispatch:
    inputs:
      force:
        description: Redeploy every resource, including ones with no detected changes
        type: boolean
        default: true

permissions:
  contents: read
  id-token: none
  statuses: write

concurrency:
  group: relay-production
  cancel-in-progress: false

jobs:
  deploy_relay:
    name: Deploy production relay
    # A manual run from another branch would deploy that branch to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      RELAY_TUNNEL_CLEANUP_MODE: ${{ vars.RELAY_TUNNEL_CLEANUP_MODE }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
      APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
      FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
      FCM_CLIENT_EMAIL: ${{ vars.FCM_CLIENT_EMAIL }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3code-relay...

      - name: Apply Neon database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: vp run --filter t3code-relay migrate

      - name: Seed Cloudflare state-store credentials
        run: |
          mkdir -p ~/.alchemy/credentials/default
          printf '%s' "$ALCHEMY_STATE_STORE_CREDENTIALS" > ~/.alchemy/credentials/default/cloudflare-state-store.json
        env:
          ALCHEMY_STATE_STORE_CREDENTIALS: ${{ secrets.ALCHEMY_STATE_STORE_CREDENTIALS }}

      - name: Deploy production relay stage
        # No --no-input: that flag exists on the upstream Alchemy CLI deploy, not
        # on this fork's scripts/deploy.ts. --yes plus the script's
        # layerNonInteractive already run it non-interactively.
        run: vp run --filter t3code-relay deploy --stage prod --yes ${{ inputs.force && '--force' || '' }}
        env:
          # The PublishClientConfig action writes the client env here instead
          # of the repo-root .env; nothing on the runner reads it.
          T3CODE_RELAY_CLIENT_CONFIG_ENV: ${{ runner.temp }}/relay-client-config.env
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}

      - name: Publish relay deploy commit status
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              context: "Relay deploy / production",
              description: "Relay production deploy completed.",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
