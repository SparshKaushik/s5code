name: Mobile EAS Build Status
on:
  workflow_dispatch:
jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 21.5.0
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - name: Inspect build
        env:
          EAS_BUILD_ID: 488e24df-197c-459e-a032-1818cb3b38cf
        run: |
          mkdir -p project
          cd project
          printf '%s\n' '{"expo":{"name":"S5 Code","slug":"t3-code","owner":"touchtechclub","extra":{"eas":{"projectId":"cb1e4b79-dfe3-4959-b200-acdc5755170e"}}}}' > app.json
          eas build:view "$EAS_BUILD_ID" --json
