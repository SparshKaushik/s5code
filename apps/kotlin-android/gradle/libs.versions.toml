[versions]
# Pinned exactly. Material 3 1.5.0-alpha26 is required: it is the first version
# in this repo's cache that ships the full expressive surface used by the design
# system (MaterialExpressiveTheme, MaterialShapes, ButtonGroup, SplitButton,
# FloatingActionButtonMenu, floating toolbars, LoadingIndicator, ToggleButton).
agp = "9.1.1"
kotlin = "2.4.10"
composeBom = "2026.08.00"
material3 = "1.5.0-alpha26"
materialIcons = "1.7.8"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
graphicsShapes = "1.0.1"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
# OkHttp carries both the HTTP client and the WebSocket the RPC protocol runs
# over, so the transport has one networking dependency rather than two. 5.1.0 is
# pinned because its matching mockwebserver3 drives the protocol tests.
okhttp = "5.1.0"
# Clerk's official Android SDK, the same auth provider the React Native client
# uses through @clerk/expo. `clerk-android-ui` pulls in `clerk-android-api`, so
# the prebuilt Compose auth views and the token APIs come from one dependency.
clerk = "1.1.3"
# CameraX plus ML Kit's bundled barcode model: QR pairing has to work on a phone
# with no Play Services model downloaded yet, which the unbundled variant cannot
# promise. Bundled costs ~2.5 MB and needs no network on first scan.
camerax = "1.6.1"
mlkitBarcode = "17.3.0"
# Coil loads workspace image previews. `coil-network-okhttp` shares the same
# OkHttp stack the transport already uses, so a signed asset URL is fetched by
# the client that already trusts the environment's certificates.
coil = "3.5.0"
# Firebase Messaging is initialized from explicit public build configuration.
# There is intentionally no google-services plugin: this package does not yet
# have a checked-in Firebase client, so unconfigured builds report that state
# instead of silently borrowing another package's identity.
firebaseMessaging = "25.1.2"
# TextMate grammar tokenizer for native Android syntax highlighting. Grammars
# are bundled in the APK and never downloaded at runtime.
kotlinTextMate = "0.2.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-material3-windowsizeclass = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "okhttp" }

clerk-android-ui = { group = "com.clerk", name = "clerk-android-ui", version.ref = "clerk" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }
kotlin-textmate-core = { group = "io.github.ivan-magda", name = "kotlin-textmate-core", version.ref = "kotlinTextMate" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
