[package]
name = "s5code-rune"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "The S5 Code desktop client, native on Rune."
publish = false

[workspace]
members = ["net"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "47cb857795c3b1dd5097c15d6161719ae738ddda", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "47cb857795c3b1dd5097c15d6161719ae738ddda", features = ["markdown", "mermaid"] }
rune-mac = { git = "https://github.com/anomalyco/rune", rev = "47cb857795c3b1dd5097c15d6161719ae738ddda" }
s5-net = { path = "net" }
serde_json = "1"
unicode-normalization = "0.1"
ureq = { version = "2", default-features = false, features = ["json"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico", "gif", "webp", "bmp"] }
alacritty_terminal = { version = "0.26", default-features = false }
# Already in the tree through alacritty_terminal; the diff's find.
regex-automata = "0.4"
# Already in the tree through rustls; PBKDF2 and SHA-256 for browser cookie import.
ring = "0.17"
# Already in the tree through rune-kit; chat Markdown blocks that hold file and thread chips.
pulldown-cmark = { version = "0.13", default-features = false }
qrcodegen = "1.8"
# Open VSX theme packages: reading deflated VSIX entries only, on the flate2 already in the tree.
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }

# Linux SnapShots over the session bus (Screenshot portal, GNOME extension), on the versions and
# features Rune's `dbus` feature already brings in.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
tokio = { version = "1", features = ["rt", "time"] }
futures-util = "0.3"
openh264 = "0.9.10"

[dev-dependencies]
s5-net = { path = "net", features = ["test-support"] }

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
codegen-units = 16
incremental = true

# Rune at the pinned rev plus SparshKaushik/rune `s5code/window-state`: `WindowHandle`'s full
# screen, maximize and frame theme, and `Tx::focused_role`/`focused_editable`. Every Rune crate in
# the tree comes from the fork so none mixes the two sources.
[patch."https://github.com/anomalyco/rune"]
rune = { git = "https://github.com/SparshKaushik/rune", rev = "0a8fe291f9f3bb8a257cebd5747d5a20467fefa7" }
rune-kit = { git = "https://github.com/SparshKaushik/rune", rev = "0a8fe291f9f3bb8a257cebd5747d5a20467fefa7" }
rune-mac = { git = "https://github.com/SparshKaushik/rune", rev = "0a8fe291f9f3bb8a257cebd5747d5a20467fefa7" }
rune-mermaid = { git = "https://github.com/SparshKaushik/rune", rev = "0a8fe291f9f3bb8a257cebd5747d5a20467fefa7" }
rune-motion = { git = "https://github.com/SparshKaushik/rune", rev = "0a8fe291f9f3bb8a257cebd5747d5a20467fefa7" }
rune-staging = { git = "https://github.com/SparshKaushik/rune", rev = "0a8fe291f9f3bb8a257cebd5747d5a20467fefa7" }
rune-taffy = { git = "https://github.com/SparshKaushik/rune", rev = "0a8fe291f9f3bb8a257cebd5747d5a20467fefa7" }
