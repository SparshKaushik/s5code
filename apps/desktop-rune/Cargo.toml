[package]
name = "s5code-rune"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "The S5 Code desktop client, native on Rune."
publish = false

[workspace]
members = ["net"]

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "47cb857795c3b1dd5097c15d6161719ae738ddda" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "47cb857795c3b1dd5097c15d6161719ae738ddda", features = ["markdown"] }
s5-net = { path = "net" }
serde_json = "1"
unicode-normalization = "0.1"
ureq = { version = "2", default-features = false, features = ["json"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
codegen-units = 16
incremental = true
