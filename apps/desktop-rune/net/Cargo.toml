[package]
name = "s5-net"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "The S5 Code server protocol for the Rune client: Effect-RPC over WebSocket, shell/thread/config state."
publish = false

[dependencies]
serde_json = "1"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
